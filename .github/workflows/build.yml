name: Compilar Baixador de Vídeos

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências do sistema (Apenas Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y python3-tk

    - name: Instalar Dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Gerar Executável
      run: pyinstaller --onefile --windowed app.py

    - name: Fazer Upload do Artefato
      uses: actions/upload-artifact@v4
      with:
        name: executavel-${{ matrix.os }}
        path: dist/*